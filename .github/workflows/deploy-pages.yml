# Builds the app and publishes it to GitHub Pages on every push to main.
# Site: https://nottakenxd.github.io/Unbeatable-Squad/
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public values: the publishable key is shipped to every browser anyway;
      # database security rules (RLS) protect the data.
      VITE_SUPABASE_URL: https://qzsiatrgprbtijseckqd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_p62h2vrozVvgR-1g3LA9xA_ORWYuaI5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # worker photos are stored with Git LFS

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site is served from /Unbeatable-Squad/, not the domain root.
      - run: pnpm exec vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
